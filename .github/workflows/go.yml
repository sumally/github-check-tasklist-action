name: go

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - '**/*.go'
      - '.golangci.yml'
      - '.github/workflows/go.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: build
        run: go build -v ./...

      - name: test
        run: go test -v ./...
